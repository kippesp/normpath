name: Windows Build, Test, and Package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build, test, and package
        working-directory: src
        run: |
          # Keep launcher files outside the checkout so version metadata stays clean.
          $launcher = Join-Path $env:RUNNER_TEMP 'build_quiet.py'
          @'
          import ctypes
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          # Children inherit this mode, including failures before main().
          kernel32 = ctypes.WinDLL("kernel32")
          kernel32.SetErrorMode(kernel32.GetErrorMode() | 0x0001 | 0x0002)

          # Resolve the runner's CMake before VsDevCmd changes PATH.
          cmake_exe = shutil.which("cmake.exe")
          if not cmake_exe:
              sys.exit("CMake was not found on the runner PATH")
          print(f"Using CMake: {cmake_exe}", flush=True)
          subprocess.run([cmake_exe, "--version"], check=True)

          vswhere = Path(os.environ["ProgramFiles(x86)"]) / "Microsoft Visual Studio/Installer/vswhere.exe"
          installation = subprocess.check_output([
              str(vswhere), "-latest", "-version", "[18.0,19.0)",
              "-products", "*", "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
              "-property", "installationPath",
          ], text=True).strip()
          if not installation:
              sys.exit("Visual Studio 2026 C++ tools were not found")

          developer_script = Path(installation) / "Common7/Tools/VsDevCmd.bat"
          batch = Path(os.environ["RUNNER_TEMP"]) / "build-and-test.cmd"
          batch.write_text(
              '@echo off\n'
              f'call "{developer_script}" -arch=x64 -host_arch=x64\n'
              'if errorlevel 1 exit /b %errorlevel%\n'
              f'"{cmake_exe}" --workflow --preset vs2026-package\n'
              'exit /b %errorlevel%\n'
          )
          sys.exit(subprocess.call(["cmd.exe", "/d", "/c", str(batch)]))
          '@ | Set-Content -Path $launcher -Encoding utf8
          python -I $launcher
          exit $LASTEXITCODE

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: np-windows-x64
          path: |
            src/build/vs2026/packages/*.zip
            src/build/vs2026/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
